name: BEAST CI
#on:
#    push:
#        branches:
#            - main
#    pull_request:

on: [push]

# Cancel if a newer run is started
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    BEAGLE_DIR: beagle-lib
    BEAGLE_LIB: beagle-lib/usr/local/lib
    LD_LIBRARY_PATH: beagle-lib/usr/local/lib
    # beagle-lib tag (or branch) CI builds; lib/beagle.jar must be built from the same commit
    BEAGLE_REF: v4.2.0
    BEAGLE_CACHE_VERSION: beagle-portable-v1
    JAVA_VERSION: "8"
    JAVA_DISTRIBUTION: temurin

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - name: Setup cmake
              uses: lukka/get-cmake@latest
            # Resolve the BEAGLE commit once: every job's cache key names it, so a push to beagle-lib during a run
            # cannot make the downstream jobs miss the cache (they use fail-on-cache-miss)
            - name: Resolve BEAGLE commit
              id: beagle
              run: |
                  sha=$(git ls-remote https://github.com/beagle-dev/beagle-lib.git "refs/tags/${BEAGLE_REF}^{}" "refs/tags/${BEAGLE_REF}" "refs/heads/${BEAGLE_REF}" | tail -1 | cut -f1)
                  test -n "$sha"
                  echo "sha=$sha" >> $GITHUB_OUTPUT
            - name: Cache BEAGLE
              id: cache
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ steps.beagle.outputs.sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
            - name: Build BEAGLE
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  BEAGLE_SHA: ${{ steps.beagle.outputs.sha }}
              run: |
                  chmod +x ./.github/scripts/build_beagle.sh
                  ./.github/scripts/build_beagle.sh
            - name: Build BEAST
              run: ant dist
            - name: Check BEAGLE
              run: |
                  ls ${BEAGLE_LIB}
                  java -jar -Djava.library.path=${BEAGLE_LIB} build/dist/beast.jar -beagle_info | tee beagle_info.txt
                  grep -q 'Using BEAGLE library v4\.2\.' beagle_info.txt
                  # jar and native agree on the pre-order flag bits: a native that keeps the old numbering (AUTO at
                  # bit 32) shows LOW_MEMORY and no MANUAL through the v4.2.0 jar
                  flags=$(grep -A1 '^0 : CPU' beagle_info.txt | grep 'Flags:')
                  echo "$flags" | grep -q -w PREORDER_TRANSPOSE_MANUAL
                  if echo "$flags" | grep -q -w PREORDER_TRANSPOSE_LOW_MEMORY; then
                      echo "The CPU resource reports PREORDER_TRANSPOSE_LOW_MEMORY: BEAGLE and lib/beagle.jar disagree"; exit 1
                  fi
            - name: Set up test matrices
              id: set-matrices
              run: |
                  echo "xml-matrix=$(ls tests/TestXML/*.xml tests/TestXMLbeagle42/*.xml | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
                  echo "xml-long-load-state-matrix=$(ls tests/TestXMLwithLoadState/*.xml | grep long.xml | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        outputs:
            beagle_sha: ${{ steps.beagle.outputs.sha }}
            xml-matrix: ${{ steps.set-matrices.outputs.xml-matrix }}
            xml-long-load-state-matrix: ${{ steps.set-matrices.outputs.xml-long-load-state-matrix }}

    test-xml:
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                file: ${{fromJson(needs.build.outputs.xml-matrix)}}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ needs.build.outputs.beagle_sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist                      
            - name: Run test for ${{ matrix.file }}
              run: java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite ${{ matrix.file }}

    # Test checkpointing by running 2 shorter analyses
    test-xml-short-load-state:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ needs.build.outputs.beagle_sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist
            - name: checkpoint adaptive MCMC
              id: checkpoint-adaptive-mcmc
              run: |
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -save_state testAdaptiveMCMC.chkpt -save_every 5000 tests/TestXMLwithLoadState/testCheckpointedRunAdaptiveMCMC.xml
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -load_state testAdaptiveMCMC.chkpt -save_state testAdaptiveMCMC.chkpt -save_every 5000 -overwrite tests/TestXMLwithLoadState/testCheckpointedRunAdaptiveMCMC.xml
            - name: checkpoint HMC
              id: checkpoint-hmc
              run: |
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -save_state testHMC.chkpt -save_every 5000 tests/TestXMLwithLoadState/testCheckpointedRunHMC.xml
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -load_state testHMC.chkpt -save_state testHMC.chkpt -save_every 5000 -overwrite tests/TestXMLwithLoadState/testCheckpointedRunHMC.xml
            - name: Check generated files
              run: ls -R
            - name: Upload checkpoint file
              uses: actions/upload-artifact@v4
              with:
                  name: checkpoint_short
                  path: ./*.chkpt
                  overwrite: true

    # Test checkpointing by running a longer analysis, and compare against the checkpoint file from the 2 shorter analyses
    test-xml-long-load-state:
        needs: [build, test-xml-short-load-state]
        if: ${{ needs.build.outputs.xml-long-load-state-matrix != '[]' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                file: ${{fromJson(needs.build.outputs.xml-long-load-state-matrix)}}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ needs.build.outputs.beagle_sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist
            - name: Download checkpoint file
              uses: actions/download-artifact@v4
              with:
                  name: checkpoint_short
            - name: Check downloaded files
              run: ls -R
            - name: Run test without load state for ${{ matrix.file }}
              id: long-checkpointing
              run: java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite ${{ matrix.file }}

    test-junit:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ needs.build.outputs.beagle_sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist
            - name: Run JUnit tests
              run: |
                  ant -Djava.library.path=${BEAGLE_LIB} junit
            # the Epoch tests skip themselves, and pass, on BEAGLE older than 4.2.0; here they must run
            - name: Check that no JUnit test was skipped
              run: |
                  ls build/junitreport/TEST-*.xml > /dev/null
                  if grep -l -E 'SKIPPED .*needs native BEAGLE 4\.2\.0' build/junitreport/TEST-*.xml; then
                      echo "JUnit tests were skipped for want of BEAGLE 4.2.0 (BEAGLE_REF ${BEAGLE_REF})"; exit 1
                  fi

    # BASTA gradients through BEAGLE-BIT 4.2 (legacy and adjoint); older BEAGLE cannot run them through BEAGLE, so they
    # are not in tests/TestXML or tests/TestXMLbeagle42 (test-older-beagle checks what they do there)
    test-basta:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BEAGLE_REF }}-${{ needs.build.outputs.beagle_sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh', 'build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist
            - name: BASTA gradient XMLs
              run: |
                  ls ${BEAGLE_LIB}/libhmsbeagle-jni-bit.*
                  for f in ci/TestXML/testBastaGradient.xml ci/TestXML/testBastaGradientAdjoint.xml; do
                      java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite "$f" > out.txt 2>&1 || { cat out.txt; exit 1; }
                      cat out.txt
                      grep -q 'Using BEAGLE BASTA resource' out.txt
                  done

    # Run-time gating: with a native BEAGLE older than 4.2 everything else must keep working, and every BEAGLE 4.2
    # feature must say so (an error or a fallback warning naming BEAGLE 4.2), never fail with an UnsatisfiedLinkError
    test-older-beagle:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # v4.0.1: the last 4.0 release; 056f565c: 4.1.0, beagle-lib's former master (by SHA: the tag v4.1
                # points at c5caedbb, which builds 4.2.0)
                beagle: [v4.0.1, 056f565c5d4fd0bcd4f1ff5488b07bfc423f0b45]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}
            - name: Setup cmake
              uses: lukka/get-cmake@latest
            - name: Resolve BEAGLE commit
              id: beagle
              env:
                  BEAGLE_REF: ${{ matrix.beagle }}
              run: |
                  if [[ "$BEAGLE_REF" =~ ^[0-9a-f]{40}$ ]]; then sha=$BEAGLE_REF; else
                      sha=$(git ls-remote https://github.com/beagle-dev/beagle-lib.git "refs/tags/${BEAGLE_REF}^{}" "refs/tags/${BEAGLE_REF}" "refs/heads/${BEAGLE_REF}" | tail -1 | cut -f1)
                  fi
                  test -n "$sha"
                  echo "sha=$sha" >> $GITHUB_OUTPUT
            - name: Cache BEAGLE
              id: cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.BEAGLE_DIR }}
                  key: ${{ env.BEAGLE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-older-${{ steps.beagle.outputs.sha }}-java${{ env.JAVA_VERSION }}-${{ hashFiles('.github/scripts/build_beagle.sh') }}
            - name: Build BEAGLE
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  BEAGLE_SHA: ${{ steps.beagle.outputs.sha }}
              run: |
                  chmod +x ./.github/scripts/build_beagle.sh
                  ./.github/scripts/build_beagle.sh
            - name: Build BEAST
              run: ant dist
            - name: Check BEAGLE is older than 4.2
              run: |
                  java -jar -Djava.library.path=${BEAGLE_LIB} build/dist/beast.jar -beagle_info | tee beagle_info.txt
                  grep -q -E 'Using BEAGLE library v4\.[01]\.' beagle_info.txt
            - name: XML tests (must pass)
              run: |
                  failed=""
                  for f in tests/TestXML/*.xml; do
                      if ! java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite "$f" > out.txt 2>&1; then
                          failed="$failed $f"; tail -30 out.txt
                      fi
                  done
                  test -z "$failed" || { echo "Failed with BEAGLE ${{ matrix.beagle }}:$failed"; exit 1; }
            - name: BEAGLE 4.2 XML tests (must name BEAGLE 4.2)
              run: |
                  unclear=""
                  for f in tests/TestXMLbeagle42/*.xml; do
                      if java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite "$f" > out.txt 2>&1; then
                          unclear="$unclear $f(exit-0)"; tail -30 out.txt; continue
                      fi
                      if grep -q -E 'UnsatisfiedLinkError|No resource matches requirements' out.txt || ! grep -q 'needs native BEAGLE 4\.2\.0' out.txt; then
                          unclear="$unclear $f"; tail -30 out.txt
                      fi
                  done
                  test -z "$unclear" || { echo "No clear BEAGLE 4.2 message:$unclear"; exit 1; }
            - name: BASTA gradient XMLs (adjoint in Java, legacy must name BEAGLE 4.2)
              run: |
                  # the adjoint gradient uses Java on BEAGLE older than 4.2.0
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite ci/TestXML/testBastaGradientAdjoint.xml > out.txt 2>&1 || { cat out.txt; exit 1; }
                  cat out.txt
                  grep -q 'need native BEAGLE 4\.2\.0 or later; found .*, so using Java' out.txt
                  # the legacy gradient goes through BEAGLE-BIT, which 4.0.x lacks; on 4.1 it must stop naming BEAGLE 4.2.0
                  if ls ${BEAGLE_LIB}/libhmsbeagle-jni-bit.* > /dev/null 2>&1; then
                      if java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite ci/TestXML/testBastaGradient.xml > out.txt 2>&1; then
                          cat out.txt; echo "The legacy BASTA gradient ran through BEAGLE older than 4.2.0"; exit 1
                      fi
                      cat out.txt
                      grep -q 'need native BEAGLE 4\.2\.0' out.txt
                      if grep -q 'UnsatisfiedLinkError' out.txt; then exit 1; fi
                  else
                      grep -q 'Using BEAGLE library v4\.0\.' beagle_info.txt
                      echo "BEAGLE 4.0.x has no BEAGLE-BIT library: the legacy BASTA gradient XML is not run"
                  fi
            - name: JUnit tests
              run: ant -Djava.library.path=${BEAGLE_LIB} junit
