name: BEAST CI
#on:
#    push:
#        branches:
#            - main
#    pull_request:

on: [push]

# Cancel if a newer run is started
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    BEAGLE_DIR: beagle-lib
    BEAGLE_LIB: beagle-lib/usr/local/lib
    LD_LIBRARY_PATH: beagle-lib/usr/local/lib
    # beagle-lib action: the action-based likelihood (COMPUTATION_ACTION at bit 47, matching lib/beagle.jar)
    BEAGLE_BRANCH: action
    # set to a commit to pin it; empty follows the branch head
    BEAGLE_SHA_PIN: ""

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
#             - name: Set up JDK 8
#               uses: actions/setup-java@v4
#               with:
#                   java-version: "17"
#                   distribution: "temurin"
            - name: Setup cmake
              uses: lukka/get-cmake@latest
            # Resolve the BEAGLE commit once: every job's cache key names it, so a push to beagle-lib during a run
            # cannot make the downstream jobs pick up a different build
            - name: Resolve BEAGLE commit
              id: beagle
              run: |
                  sha=${BEAGLE_SHA_PIN:-$(git ls-remote https://github.com/beagle-dev/beagle-lib.git refs/heads/${BEAGLE_BRANCH} | cut -f1)}
                  test -n "$sha"
                  echo "sha=$sha" >> $GITHUB_OUTPUT
            - name: Cache BEAGLE
              id: cache
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: beagle-beast-${{ env.BEAGLE_BRANCH }}-${{ steps.beagle.outputs.sha }}-${{ hashFiles('**/build_beagle.sh', '**/build.xml') }}
            - name: Build BEAGLE
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  BEAGLE_SHA: ${{ steps.beagle.outputs.sha }}
              run: |
                  chmod +x ./.github/scripts/build_beagle.sh
                  ./.github/scripts/build_beagle.sh
            - name: Build BEAST
              run: ant dist
            - name: Check BEAGLE
              run: |
                  ls ${BEAGLE_LIB}
                  java -jar -Djava.library.path=${BEAGLE_LIB} build/dist/beast.jar -beagle_info
            - name: Set up test matrices
              id: set-matrices
              run: |
                  echo "xml-matrix=$(ls tests/TestXML/*.xml | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
                  echo "xml-load-state-matrix=$(ls tests/TestXMLwithLoadState/*.xml | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        outputs:
            beagle_sha: ${{ steps.beagle.outputs.sha }}
            xml-matrix: ${{ steps.set-matrices.outputs.xml-matrix }}
            xml-load-state-matrix: ${{ steps.set-matrices.outputs.xml-load-state-matrix }}

    test-xml:
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                file: ${{fromJson(needs.build.outputs.xml-matrix)}}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: beagle-beast-${{ env.BEAGLE_BRANCH }}-${{ needs.build.outputs.beagle_sha }}-${{ hashFiles('**/build_beagle.sh', '**/build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist                      
            - name: Run test for ${{ matrix.file }}
              run: java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -overwrite ${{ matrix.file }}

    test-xml-load-state:
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                file: ${{fromJson(needs.build.outputs.xml-load-state-matrix)}}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: beagle-beast-${{ env.BEAGLE_BRANCH }}-${{ needs.build.outputs.beagle_sha }}-${{ hashFiles('**/build_beagle.sh', '**/build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist                      
            - name: Run test with load state for ${{ matrix.file }}
              run: |
                  checkpoint=tests/TestXMLwithLoadState/$(basename ${{ matrix.file }} .xml).chkpt
                  java -Djava.library.path=${BEAGLE_LIB} -jar build/dist/beast.jar -fail_threads -seed 666 -load_state $checkpoint -overwrite ${{ matrix.file }}

    test-junit:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: "8"
                  distribution: "adopt"
            - uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.BEAGLE_DIR }}
                      build/dist
                  key: beagle-beast-${{ env.BEAGLE_BRANCH }}-${{ needs.build.outputs.beagle_sha }}-${{ hashFiles('**/build_beagle.sh', '**/build.xml') }}
                  fail-on-cache-miss: true
            - name: Rebuild project
              run: ant dist
            - name: Run JUnit tests
              run: |
                  ant -Djava.library.path=${BEAGLE_LIB} junit
